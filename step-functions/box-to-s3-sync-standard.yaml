Comment: Box to S3 data sync state machine definition
StartAt: ExecutionParams
States:
  # Configuration of execution parameters
  ExecutionParams:
    Type: Pass
    Comment: Add execution_name and execution_start_time to Input
    Parameters:
      execution_name.$: $$.Execution.Name
      execution_start_time.$: $$.Execution.StartTime
      # デフォルトパラメータをここで設定
      intervalHours: null
      filePrefix: null
    Next: MergeExecutionParams

  MergeExecutionParams:
    Type: Pass
    Parameters:
      params.$: States.JsonMerge($, $$.Execution.Input, false)
    OutputPath: $.params
    Next: Init

  Init:
    Type: Pass
    Comment: Configure and validate initial parameters
    Parameters:
      KnowledgeBaseId.$: $.KnowledgeBaseId
      DataSourceId.$: $.DataSourceId
      execution_name.$: $.execution_name
      execution_start_time.$: $.execution_start_time
      # 入力からパラメータを渡すだけにする（ExecutionParamsで既にデフォルト値設定済み）
      intervalHours.$: $.intervalHours
      filePrefix.$: $.filePrefix
    Next: BoxSync

  # Stage 1: Box to S3 data synchronization
  BoxSync:
    Type: Parallel
    Next: DataSourceSync
    ResultSelector:
      execution_name.$: $[0].execution_name
      execution_start_time.$: $[0].execution_start_time
      intervalHours.$: $[0].intervalHours
      filePrefix.$: $[0].filePrefix
      KnowledgeBaseId.$: $[0].KnowledgeBaseId
      DataSourceId.$: $[0].DataSourceId
      boxData.$: $[0].boxData
    Branches:
      # Box to S3 data synchronization
      - StartAt: InitBoxSync
        States:
          InitBoxSync:
            Type: Pass
            Parameters:
              execution_name.$: $.execution_name
              execution_start_time.$: $.execution_start_time
              intervalHours.$: $.intervalHours
              filePrefix.$: $.filePrefix
              KnowledgeBaseId.$: $.KnowledgeBaseId
              DataSourceId.$: $.DataSourceId
            Next: Execute

          Execute:
            Type: Task
            Comment: Invoke Lambda function for Box to S3 data sync
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: "${BoxToS3FunctionArn}"
              Payload.$: $
            Retry:
              - ErrorEquals:
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: "$.error"
                Next: BoxSyncFailed
            Next: BoxSyncSuccess
            ResultPath: "$.boxData"

          BoxSyncSuccess:
            Type: Succeed

          BoxSyncFailed:
            Type: Fail
            Error: "BoxSyncFailed"
            Cause: "Box to S3 data synchronization failed"

  # Stage 2: Knowledge base data source synchronization
  DataSourceSync:
    Type: Parallel
    Next: Complete
    ResultSelector:
      execution_name.$: $[0].execution_name
      execution_start_time.$: $[0].execution_start_time
      intervalHours.$: $[0].intervalHours
      filePrefix.$: $[0].filePrefix
      KnowledgeBaseId.$: $[0].KnowledgeBaseId
      DataSourceId.$: $[0].DataSourceId
      boxData.$: $[0].boxData
      kbSyncJobId.$: $[0].kbSyncJobId
    Branches:
      # Knowledge base data source sync (execution only)
      - StartAt: InitDataSourceSync
        States:
          InitDataSourceSync:
            Type: Pass
            Parameters:
              execution_name.$: $.execution_name
              execution_start_time.$: $.execution_start_time
              intervalHours.$: $.intervalHours
              filePrefix.$: $.filePrefix
              KnowledgeBaseId.$: $.KnowledgeBaseId
              DataSourceId.$: $.DataSourceId
              boxData.$: $.boxData
            Next: StartIngestion

          StartIngestion:
            Type: Task
            Comment: Start data ingestion job for Bedrock knowledge base
            Resource: arn:aws:states:::aws-sdk:bedrockagent:startIngestionJob
            Parameters:
              KnowledgeBaseId.$: "$.KnowledgeBaseId"
              DataSourceId.$: "$.DataSourceId"
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: "$.syncError"
                Next: DataSourceSyncFailed
            ResultPath: "$.kbSyncJob"
            Next: DataSourceSyncSuccess

          DataSourceSyncSuccess:
            Type: Pass
            Comment: Knowledge base sync job started successfully
            Parameters:
              execution_name.$: "$.execution_name"
              execution_start_time.$: "$.execution_start_time"
              intervalHours.$: "$.intervalHours"
              filePrefix.$: "$.filePrefix"
              KnowledgeBaseId.$: "$.KnowledgeBaseId"
              DataSourceId.$: "$.DataSourceId"
              boxData.$: "$.boxData"
              kbSyncJobId.$: "$.kbSyncJob.IngestionJob.IngestionJobId"
            End: true

          DataSourceSyncFailed:
            Type: Fail
            Error: "DataSourceSyncFailed"
            Cause: "Failed to start knowledge base data source sync"

  # Final state
  Complete:
    Type: Pass
    Comment: Process completed successfully
    Parameters:
      status: "SUCCESS"
      boxData.$: "$.boxData"
      knowledgeBaseSync:
        status: "STARTED"
        jobId.$: "$.kbSyncJobId"
      execution_details:
        name.$: "$.execution_name"
        start_time.$: "$.execution_start_time"
        end_time.$: "$$.State.EnteredTime"
    End: true
